services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chunking-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: always

  embedding-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: chunking-embedding-gpu
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  neo4j:
    image: neo4j:5.12.0
    container_name: grayu-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt Protocol (for drivers and Cypher shell)
    volumes:
      - ./graph/data:/var/lib/neo4j/import
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/1234
      - NEO4J_dbms_security_auth__minimum__password__length=4
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
